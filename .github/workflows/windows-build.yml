name: Windows build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout LibertyBoard
        uses: actions/checkout@v4
        with:
          path: LibertyBoard

      - name: Checkout OpenBoard third-party libraries
        uses: actions/checkout@v4
        with:
          repository: OpenBoard-org/OpenBoard-ThirdParty
          path: OpenBoard-ThirdParty

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebengine qtwebchannel qtpositioning qt5compat qtimageformats'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        working-directory: LibertyBoard
        run: |
          qmake OpenBoard.pro -spec win32-msvc "CONFIG+=release" || exit /b 1
          lrelease OpenBoard.pro || exit /b 1
          nmake release-install || exit /b 1
          if not exist build\win32\release\product\OpenBoard.exe exit /b 1

      - name: Collect runtime files
        shell: cmd
        working-directory: LibertyBoard
        run: |
          set PRODUCT=build\win32\release\product
          windeployqt --release --compiler-runtime --no-system-d3d-compiler %PRODUCT%\OpenBoard.exe || exit /b 1
          xcopy /y /q ..\OpenBoard-ThirdParty\poppler\bin\*.dll %PRODUCT%\ || exit /b 1
          xcopy /y /q ..\OpenBoard-ThirdParty\openssl\openssl-3.0.15-win64\bin\*.dll %PRODUCT%\ || exit /b 1
          xcopy /y /q /s /i resources\customizations %PRODUCT%\customizations || exit /b 1
          xcopy /y /q /s /i resources\startupHints %PRODUCT%\startupHints || exit /b 1
          ren %PRODUCT%\OpenBoard.exe LibertyBoard.exe || exit /b 1

      - name: Upload LibertyBoard
        uses: actions/upload-artifact@v4
        with:
          name: LibertyBoard-windows
          path: LibertyBoard/build/win32/release/product
          retention-days: 30
