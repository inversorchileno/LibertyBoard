<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>表情符号和 GIF</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">表情符号和 GIF</h1>
<p class="intro">让页面更生动。</p>
<div class="image"><img src="../../assets/guide/emoji.png" alt=""></div>
<ul>
<li><b>表情符号</b>：从 72 个中选择一个并点击页面；大小在栏中设置。</li>
<li><b>GIF</b>：右侧打开 klipy.com 页面；把 GIF 拖到页面上，它会动起来。</li>
<li>GIF 窗口可点击 ✕ 或再次点击 GIF 关闭。</li>
</ul>
<span class="tip">也可以从任何浏览器拖入 GIF。</span>
</body>
</html>
