<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>自定义和快捷键</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">自定义和快捷键</h1>
<p class="intro">按你的方式使用 LibertyBoard。</p>
<div class="image"><img src="../../assets/guide/customize.png" alt=""></div>
<div class="image"><img src="../../assets/guide/shortcuts.png" alt=""></div>
<ul>
<li><b>工具</b>：所有工具，包括从工具栏移除的。</li>
<li><b>自定义</b>：勾选要在桌面和白板上显示的按钮；勾选时菜单不会关闭。</li>
<li><b>移动项目</b>：拖动按钮排列顺序。</li>
<li><b>关于 → 快捷键</b>：所有快捷键；选择功能，按下新按键并点击“分配”。与 Windows 或其他功能冲突时会说明原因。</li>
</ul>
<span class="tip">首选项（在主页中）包含语言、笔压、桌面边框和 AI。</span>
</body>
</html>
