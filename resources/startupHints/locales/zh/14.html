<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>附加文件 / 超链接、声音和截图</title>

<body>
<h1 class="title">附加文件 / 超链接、声音和截图</h1>
<p class="intro">把更多内容带到页面上。</p>
<div class="image"><img src="../../assets/guide/attach.png" alt=""></div>
<ul>
<li><b>文件</b>：在页面上放置一个双击即可打开的文件。</li>
<li><b>超链接</b>：指向网页的链接。</li>
<li><b>声音</b>：录下你的声音并放在页面上。</li>
<li><b>保存截图</b>：把白板保存为图片，放在“图片”文件夹中。</li>
</ul>
<span class="tip">在桌面模式中，附加功能会放置超链接。</span>
</body>
</html>
