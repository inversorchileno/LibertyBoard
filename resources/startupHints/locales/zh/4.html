<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>记号笔和橡皮擦</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">记号笔和橡皮擦</h1>
<p class="intro">记号笔在文字上涂色而不遮住文字；橡皮擦清除所画内容。</p>
<div class="image"><img src="../../assets/guide/marker.png" alt=""></div>
<div class="image"><img src="../../assets/guide/eraser.png" alt=""></div>
<ul>
<li>记号笔：<b>圆头</b>（两端圆润）或<b>平头</b>（像荧光笔，横跨文字行）。</li>
<li>记号笔：颜色、粗细和透明度。</li>
<li><b>整体</b>擦除：擦掉碰到的整条笔画。</li>
<li><b>局部</b>擦除：只擦掉经过的部分，大小可选。</li>
</ul>
<span class="tip">在桌面模式中，工具栏的垃圾桶会清除屏幕上的所有绘画。</span>
</body>
</html>
