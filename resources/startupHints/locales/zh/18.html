<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>桌面模式</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">桌面模式</h1>
<p class="intro">在任何打开的程序上书写和绘画。</p>
<div class="image"><img src="../../assets/guide/desktop.png" alt=""></div>
<ul>
<li>点击右上角的<b>桌面</b>进入；工具栏的第一个按钮返回白板。</li>
<li>按钮上的<b>三角形</b>显示其选项。</li>
<li><b>AI</b> 使用你所选的屏幕区域，带回的内容留在桌面上。</li>
<li><b>红色三角形</b>可缩小工具栏；<b>垃圾桶</b>清除所有绘画。</li>
<li><b>彩色边框</b>提醒你正处于桌面模式（首选项）。</li>
</ul>
<span class="tip">工具栏在左右边缘时竖排，在上下边缘时横排。</span>
</body>
</html>
