<body>
<h1 class="title">聚光灯 / 放大镜</h1>
<p class="intro">让所有人看向同一个地方。</p>
<div class="image"><img src="../../assets/guide/spotlight.png" alt=""></div>
<ul>
<li><b>聚光灯</b>：除指针周围的圆圈外，屏幕变暗（在栏中调整<b>半径</b>和<b>暗度</b>）。</li>
<li><b>放大镜</b>：放大指针下方的内容。</li>
<li>聚光灯和放大镜按钮用于开启、切换和关闭。</li>
</ul>
<span class="tip">工具栏中的图标只选择工具；用它的按钮来开启。</span>
</body>
