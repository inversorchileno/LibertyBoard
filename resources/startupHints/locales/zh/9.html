<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>便笺和快速便笺</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">便笺和快速便笺</h1>
<p class="intro">可以在页面上书写的彩色纸条。</p>
<div class="image"><img src="../../assets/guide/note.png" alt=""></div>
<ul>
<li><b>便笺</b>：选择颜色后点击页面，用键盘在里面书写。</li>
<li><b>快速便笺</b>：点击即可打开和关闭的小评论。</li>
<li>便笺可以像其他对象一样移动和调整大小。</li>
</ul>
<span class="tip">便笺图标显示下一张便笺的颜色。</span>
</body>
</html>
