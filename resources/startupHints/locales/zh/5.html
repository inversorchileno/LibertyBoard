<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>激光笔</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">激光笔</h1>
<p class="intro">演示时用来指示，不留下任何痕迹。</p>
<div class="image"><img src="../../assets/guide/laser.png" alt=""></div>
<ul>
<li><b>轨迹</b>：留下逐渐消失的线。<b>点</b>：只有一个红点。<b>跟随</b>：不用点击，跟随鼠标。</li>
<li>效果：<b>标准</b>、<b>白色光晕</b>和<b>彩虹</b>。</li>
<li><b>不透明度</b>、<b>等待</b>（轨迹停留时间）和<b>淡出</b>（消失所需时间）。</li>
<li>粗细和颜色与笔相同。</li>
</ul>
<span class="tip">画布锁定时激光笔仍可使用。</span>
</body>
</html>
