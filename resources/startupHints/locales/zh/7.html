<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>高亮和下划线</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">高亮和下划线</h1>
<p class="intro">像用荧光笔一样标记 PDF 中的文字。</p>
<div class="image"><img src="../../assets/guide/highlight.png" alt=""></div>
<ul>
<li><b>高亮</b>：用所选颜色和透明度涂抹拖过的文字。</li>
<li><b>适应字号</b>：高亮正好与行高一致，并留一点边距。</li>
<li><b>下划线</b>：在文字下方画线。</li>
</ul>
<span class="tip">用 主页 → 保存 可将高亮保存在 PDF 中。</span>
</body>
</html>
