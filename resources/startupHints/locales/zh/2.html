<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>工具栏</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">工具栏</h1>
<p class="intro">每个按钮选择一个工具，其选项出现在上方的栏中。</p>
<div class="image"><img src="../../assets/guide/palette.png" alt=""></div>
<ul>
<li>在<b>自定义</b>菜单中，选择白板和桌面上显示哪些按钮。</li>
<li>用<b>自定义 → 移动项目</b>拖动按钮来改变顺序。</li>
<li>从工具栏移除的工具仍在<b>工具</b>菜单中。</li>
<li>每个工具都有快捷键：在<b>关于 → 快捷键</b>中查看和修改。</li>
</ul>
<span class="tip">像 聚光灯 / 放大镜 这样有两种功能的工具，在选项栏中切换。</span>
</body>
</html>
