<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文字</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">文字</h1>
<p class="intro">用键盘书写。</p>
<div class="image"><img src="../../assets/guide/text.png" alt=""></div>
<ul>
<li>点击页面即可输入；字体、字号、粗体、斜体和颜色在栏中。</li>
<li><b>复选框</b>、<b>项目符号</b>和<b>编号</b>。</li>
<li><b>表格</b>：询问行数和列数；Tab 跳到下一个单元格；表格线可拖动。</li>
<li><b>听写</b>：写下你说的话（Windows 听写，Windows + H）。</li>
<li><b>转写</b>：借助 AI 写出录音中所说的内容。</li>
</ul>
<span class="tip">每个文本框中 F 左边的麦克风也可以听写。</span>
</body>
</html>
