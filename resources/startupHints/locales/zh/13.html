<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>形状和箭头</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">形状和箭头</h1>
<p class="intro">规整的图形和箭头，方便讲解。</p>
<div class="image"><img src="../../assets/guide/shapes.png" alt=""></div>
<div class="image"><img src="../../assets/guide/arrow.png" alt=""></div>
<ul>
<li>20 种<b>形状</b>：直线、折线、椭圆、矩形、三角形、菱形、块状箭头、星形、对话气泡和云。</li>
<li><b>折线</b>：每个拐角点击一次；按任意键结束，Esc 取消。</li>
<li><b>边框</b>和<b>填充</b>可设置颜色、粗细、线型和不透明度。</li>
<li><b>箭头</b>：线型、端点，以及向箭头尖逐渐变粗的<b>锥形</b>箭头。</li>
</ul>
<span class="tip">形状图标显示所选的形状。</span>
</body>
</html>
