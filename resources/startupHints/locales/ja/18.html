<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>デスクトップモード</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">デスクトップモード</h1>
<p class="intro">開いているどのプログラムの上にも書いたり描いたりできます。</p>
<div class="image"><img src="../../assets/guide/desktop.png" alt=""></div>
<ul>
<li>右上の<b>デスクトップ</b>で入ります。パレットの最初のボタンでボードに戻ります。</li>
<li>ボタンの<b>三角</b>でオプションが開きます。</li>
<li><b>AI</b> は選んだ画面の範囲で動き、結果はデスクトップの上に置かれます。</li>
<li><b>赤い三角</b>でパレットを小さくし、<b>ごみ箱</b>で描画をすべて消します。</li>
<li><b>色付きの枠</b>がデスクトップモード中であることを示します(設定)。</li>
</ul>
<span class="tip">パレットは左右の端では縦に、上下では横になります。</span>
</body>
</html>
