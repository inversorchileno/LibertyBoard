<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>マーカーと消しゴム</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">マーカーと消しゴム</h1>
<p class="intro">マーカーは文字を隠さずに上から塗り、消しゴムは描いたものを消します。</p>
<div class="image"><img src="../../assets/guide/marker.png" alt=""></div>
<div class="image"><img src="../../assets/guide/eraser.png" alt=""></div>
<ul>
<li>マーカー:<b>丸いペン先</b>(端が丸い)または<b>平らなペン先</b>(蛍光ペンのように行に沿って太い)。</li>
<li>マーカー:色、太さ、透明度。</li>
<li><b>全体</b>消しゴム:触れた線をまるごと消します。</li>
<li><b>部分</b>消しゴム:なぞった部分だけを、選んだ大きさで消します。</li>
</ul>
<span class="tip">デスクトップモードでは、パレットのごみ箱で画面上の描画をすべて消せます。</span>
</body>
</html>
