<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>読み上げ</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">読み上げ</h1>
<p class="intro">Windows の音声で文字を読み上げます。</p>
<div class="image"><img src="../../assets/guide/voice.png" alt=""></div>
<ul>
<li><b>最初から</b>:ページを読み、続けて次のページへ。</li>
<li><b>選択したテキスト</b>:読みたい文字を四角形で囲むと、黄色で示されます。</li>
<li><b>クリックした所から</b>:触れた単語から読みます。</li>
<li><b>再生</b>、<b>一時停止</b>、<b>停止</b>、<b>次のページ</b>。</li>
</ul>
<span class="tip">編集 → 読み上げと音声入力 → 読み上げ(Ctrl + Shift + L)からも使えます。</span>
</body>
</html>
