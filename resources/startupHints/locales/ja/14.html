<h1 class="title">ファイルを添付 / ハイパーリンク、音声、スクリーンショット</h1>
<p class="intro">ページにさまざまなものを持ち込みます。</p>
<div class="image"><img src="../../assets/guide/attach.png" alt=""></div>
<ul>
<li><b>ファイル</b>:ダブルクリックで開くファイルをページに置きます。</li>
<li><b>ハイパーリンク</b>:Web ページへのリンク。</li>
<li><b>音声</b>:声を録音してページに置きます。</li>
<li><b>スクリーンショットを保存</b>:ボードを画像としてピクチャフォルダーに保存します。</li>
</ul>
<span class="tip">デスクトップモードでは、添付はハイパーリンクになります。</span>
</body>
