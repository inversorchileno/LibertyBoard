<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>絵文字と GIF</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">絵文字と GIF</h1>
<p class="intro">ページを楽しく彩ります。</p>
<div class="image"><img src="../../assets/guide/emoji.png" alt=""></div>
<ul>
<li><b>絵文字</b>:72 種類から選んでページをクリックします。大きさはバーで設定します。</li>
<li><b>GIF</b>:右側に klipy.com のページが開きます。GIF をページにドラッグすると動きます。</li>
<li>GIF のウィンドウは ✕ か、もう一度 GIF をクリックすると閉じます。</li>
</ul>
<span class="tip">どのブラウザーからでも GIF をドラッグできます。</span>
</body>
</html>
