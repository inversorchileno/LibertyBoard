<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>スポットライト / 拡大鏡</title>

<body>
<h1 class="title">スポットライト / 拡大鏡</h1>
<p class="intro">みんなの視線を一か所に集めます。</p>
<div class="image"><img src="../../assets/guide/spotlight.png" alt=""></div>
<ul>
<li><b>スポットライト</b>:ポインターの周りの円以外を暗くします(バーで<b>半径</b>と<b>暗さ</b>を調整)。</li>
<li><b>拡大鏡</b>:ポインターの下を拡大します。</li>
<li>スポットライトと拡大鏡のボタンで、オン・切り替え・オフを行います。</li>
</ul>
<span class="tip">パレットのアイコンはツールを選ぶだけです。オンにするのはそのボタンです。</span>
</body>
</html>
