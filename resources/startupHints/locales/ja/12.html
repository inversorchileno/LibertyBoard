<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>テキスト</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">テキスト</h1>
<p class="intro">キーボードで文字を書きます。</p>
<div class="image"><img src="../../assets/guide/text.png" alt=""></div>
<ul>
<li>ページをクリックして入力します。フォント、サイズ、太字、斜体、色はバーで。</li>
<li><b>チェックボックス</b>、<b>箇条書き</b>、<b>番号</b>。</li>
<li><b>表</b>:行と列の数をたずねます。Tab で次のセルへ、罫線はドラッグで動かせます。</li>
<li><b>音声入力</b>:話した言葉を書きます(Windows の音声入力、Windows + H)。</li>
<li><b>文字起こし</b>:録音の内容を AI が書き起こします。</li>
</ul>
<span class="tip">各テキストボックスの F の左にあるマイクでも音声入力できます。</span>
</body>
</html>
