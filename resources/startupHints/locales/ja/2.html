<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ツールパレット</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">ツールパレット</h1>
<p class="intro">各ボタンでツールを選ぶと、そのオプションが上のバーに表示されます。</p>
<div class="image"><img src="../../assets/guide/palette.png" alt=""></div>
<ul>
<li><b>カスタマイズ</b>メニューで、ボードとデスクトップに表示するボタンを選べます。</li>
<li><b>カスタマイズ → 項目を移動</b>で、ドラッグして順番を変えられます。</li>
<li>パレットから外したツールも<b>ツール</b>メニューに残ります。</li>
<li>各ツールにはキーボードショートカットがあります。<b>情報 → ショートカット</b>で確認・変更できます。</li>
</ul>
<span class="tip">スポットライト / 拡大鏡のように二つの機能を持つツールは、オプションバーで切り替えます。</span>
</body>
</html>
