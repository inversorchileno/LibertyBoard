<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>図形と矢印</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">図形と矢印</h1>
<p class="intro">説明に役立つきれいな図形と矢印。</p>
<div class="image"><img src="../../assets/guide/shapes.png" alt=""></div>
<div class="image"><img src="../../assets/guide/arrow.png" alt=""></div>
<ul>
<li>20 種類の<b>図形</b>:線、折れ線、楕円、四角形、三角形、ひし形、ブロック矢印、星、吹き出し、雲。</li>
<li><b>折れ線</b>:角ごとにクリック。任意のキーで終了、Esc で取り消し。</li>
<li><b>枠線</b>と<b>塗りつぶし</b>の色、太さ、線のスタイル、不透明度。</li>
<li><b>矢印</b>:線のスタイル、端の形、先端に向かって太くなる<b>テーパー</b>矢印。</li>
</ul>
<span class="tip">図形のアイコンには選んだ図形が表示されます。</span>
</body>
</html>
