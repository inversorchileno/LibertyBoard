<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>レーザーポインター</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">レーザーポインター</h1>
<p class="intro">発表中に、何も残さずに指し示すためのツールです。</p>
<div class="image"><img src="../../assets/guide/laser.png" alt=""></div>
<ul>
<li><b>軌跡</b>:消えていく線を残します。<b>点</b>:赤い点だけ。<b>追従</b>:クリックせずにマウスを追います。</li>
<li>効果:<b>標準</b>、<b>白い輝き</b>、<b>虹</b>。</li>
<li><b>不透明度</b>、<b>待機</b>(軌跡が残る時間)、<b>フェード</b>(消えるまでの時間)。</li>
<li>太さと色はペンと同じです。</li>
</ul>
<span class="tip">レーザーはロックしたキャンバスでも使えます。</span>
</body>
</html>
