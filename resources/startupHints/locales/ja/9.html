<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>メモとクイックメモ</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">メモとクイックメモ</h1>
<p class="intro">ページの上に書き込める色付きの紙です。</p>
<div class="image"><img src="../../assets/guide/note.png" alt=""></div>
<ul>
<li><b>メモ</b>:色を選んでページをクリックし、キーボードで書きます。</li>
<li><b>クイックメモ</b>:クリックで開閉する小さなコメントです。</li>
<li>メモはほかのオブジェクトと同じく移動・サイズ変更できます。</li>
</ul>
<span class="tip">メモのアイコンには次のメモの色が表示されます。</span>
</body>
</html>
