<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ハイライトと下線</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">ハイライトと下線</h1>
<p class="intro">PDF の文字に蛍光ペンのように印を付けます。</p>
<div class="image"><img src="../../assets/guide/highlight.png" alt=""></div>
<ul>
<li><b>ハイライト</b>:ドラッグした文字を、選んだ色と透明度で塗ります。</li>
<li><b>文字の大きさに合わせる</b>:行の高さにぴったり合わせ、少し余白を付けます。</li>
<li><b>下線</b>:文字の下に線を引きます。</li>
</ul>
<span class="tip">ハイライトは ホーム → 保存 で PDF の中に保存されます。</span>
</body>
</html>
